<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistem Bilgisayar · Teknik Servis Takip</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f1f5f9;color:#0f172a}.wrap{max-width:840px;margin:auto;padding:24px}.card{border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 3px 18px #0f172a0b}.status{display:inline-block;padding:.35rem .65rem;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:700}.timeline{border-left:2px solid #cbd5e1;margin-left:8px;padding-left:18px}.item{position:relative;padding-bottom:14px}.item:before{content:'';position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:#2563eb}.portal-logo{width:min(320px,85vw);height:105px;object-fit:contain}.brandline{font-weight:800;color:#1e3a8a}.yearbadge{display:inline-flex;align-items:center;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:999px;padding:.35rem .7rem;font-weight:800;font-size:.78rem}.offer-card{border:2px solid #f59e0b;background:#fffbeb}.offer-actions .btn{min-height:52px;font-weight:800}.portal-footer{font-size:.82rem;color:#64748b;text-align:center;margin:24px 0 8px}</style></head><body><div class="wrap"><div class="text-center mb-4"><img src="/assets/SistemBilgisayar_2026.png" class="portal-logo" alt="Sistem Bilgisayar"><div class="brandline">Teknik Servis Takip</div><div class="text-secondary small mb-2">Servis durumunuzu güvenli şekilde takip edin</div><span class="yearbadge">2003'ten beri · 23. yıl</span></div><div class="card p-4 mb-3"><form id="q" class="row g-2"><div class="col-md-5"><label class="form-label">Servis No</label><input id="sn" class="form-control" placeholder="SRV-2026-0014" required></div><div class="col-md-5"><label class="form-label">Telefon</label><input id="ph" class="form-control" type="text" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="05XX XXX XX XX" required></div><div class="col-md-2 d-grid align-items-end"><button class="btn btn-primary mt-md-4">Sorgula</button></div></form><div id="err" class="text-danger small mt-2"></div></div><div id="result"></div><div class="portal-footer">Sistem Bilgisayar · Teknoloji • Satış • Servis • Çözüm Ortağınız</div></div><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>(+n||0).toLocaleString('tr-TR')+' ₺';function normPhone(v){let d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('90')&&d[2]==='5')d='0'+d.slice(2);else if(d.length===10&&d[0]==='5')d='0'+d;return d}function validPhone(v){let d=normPhone(v);return d.length===11&&d.startsWith('05')}function formatPhone(v){let d=normPhone(v);return d.length===11?`${d.slice(0,4)} ${d.slice(4,7)} ${d.slice(7,9)} ${d.slice(9,11)}`:String(v||'')}function maskPhone(el){let d=String(el.value||'').replace(/\D/g,'');if(d.startsWith('90'))d='0'+d.slice(2);d=d.slice(0,11);let a=[];if(d.length)a.push(d.slice(0,4));if(d.length>4)a.push(d.slice(4,7));if(d.length>7)a.push(d.slice(7,9));if(d.length>9)a.push(d.slice(9,11));el.value=a.join(' ')}function d(x){if(!x)return'-';let z=String(x).slice(0,10).split('-');return z.length===3?z.reverse().join('/'):x}async function load(){let sn=$('sn').value.trim(),ph=normPhone($('ph').value),token=new URLSearchParams(location.search).get('token')||'';if(!token&&(!sn||!ph))return;if(!token&&!validPhone(ph)){$('err').textContent='Telefon numarası 05 ile başlayan 11 haneli cep telefonu olmalıdır.';return}$('ph').value=formatPhone(ph);let r=await fetch(token?('/api/portal?token='+encodeURIComponent(token)):('/api/portal?serviceNo='+encodeURIComponent(sn)+'&phone='+encodeURIComponent(ph)),{cache:'no-store'}),j=await r.json();if(!r.ok){$('err').textContent=j.error||'Kayıt bulunamadı';$('result').innerHTML='';return}$('err').textContent='';render(j.service)}function render(s){let latest=[...(s.offers||[])].sort((a,b)=>(b.version||0)-(a.version||0))[0];$('result').innerHTML=`<div class="card p-4 mb-3"><div class="d-flex justify-content-between flex-wrap gap-2"><div><div class="text-secondary small">SERVİS KAYDI</div><h4 class="fw-bold">${esc(s.serviceNo)}</h4></div><span class="status">${esc(s.status)}</span></div><hr><div class="row g-3"><div class="col-md-6"><strong>Cihaz</strong><div>${esc(s.deviceType||'')} · ${esc(s.deviceModel||'')}</div><small class="text-secondary">Seri/IMEI: ${esc(s.serialNo||'-')}</small></div><div class="col-md-6"><strong>Tarihler</strong><div>Giriş: ${d(s.entryDate)} · Tahmini teslim: ${d(s.estimatedDate)}</div></div><div class="col-12"><strong>Arıza / Talep</strong><div class="bg-light rounded p-2 mt-1">${esc(s.complaint||'-')}</div></div></div>${s.business?`<div class="mt-3 pt-3 border-top small text-secondary"><strong>${esc(s.business.name||'Sistem Bilgisayar')}</strong>${s.business.phone?' · '+esc(s.business.phone):''}${s.business.email?' · '+esc(s.business.email):''}${s.business.address?'<br>'+esc(s.business.address):''}</div>`:''}</div>${latest?`<div class="card p-4 mb-3 offer-card"><div class="d-flex justify-content-between flex-wrap gap-2"><div><strong class="fs-5">Onayınızı Bekleyen Teklif · v${latest.version}</strong><div class="text-secondary">${esc(latest.note||'')}</div></div><h4>${money(latest.amount)}</h4></div><div class="mt-2"><span class="badge ${latest.status==='Onaylandı'?'text-bg-success':latest.status==='Reddedildi'?'text-bg-danger':'text-bg-warning'}">${esc(latest.status)}</span></div>${latest.status==='Onay Bekliyor'?`<div class="d-flex gap-2 mt-3 offer-actions flex-wrap"><button class="btn btn-success flex-grow-1" onclick="decide('${latest.id}','approve')">Teklifi Onayla</button><button class="btn btn-outline-danger flex-grow-1" onclick="decide('${latest.id}','reject')">Reddet</button></div>`:''}</div>`:''}<div class="card p-4"><strong>Servis Zaman Çizelgesi</strong><div class="timeline mt-3">${(s.history||[]).slice().reverse().map(h=>`<div class="item"><div class="small fw-bold">${new Date(h.date).toLocaleString('tr-TR')}</div><div>${esc(h.text)}</div></div>`).join('')||'<div class="text-secondary">Henüz hareket yok.</div>'}</div></div>`}async function decide(id,decision){if(!confirm(decision==='approve'?'Teklifi onaylıyor musunuz?':'Teklifi reddediyor musunuz?'))return;let r=await fetch('/api/portal/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceNo:$('sn').value,phone:$('ph').value,token:new URLSearchParams(location.search).get('token')||'',offerId:id,decision})}),j=await r.json();if(!r.ok)return alert(j.error||'İşlem yapılamadı');render(j.service)}$('q').onsubmit=e=>{e.preventDefault();load()};$('ph').addEventListener('input',e=>maskPhone(e.target));$('ph').addEventListener('blur',e=>{e.target.value=formatPhone(e.target.value)});let p=new URLSearchParams(location.search);$('sn').value=p.get('serviceNo')||'';$('ph').value=p.get('phone')||'';if(p.get('token')){document.querySelector('#q').closest('.card').style.display='none';load()}else if($('sn').value&&$('ph').value)load();</script></body></html>
