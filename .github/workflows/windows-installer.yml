name: Teknik Servis Pro - Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "server.py"
      - "requirements.txt"
      - "db.json"
      - "assets/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kur
        shell: powershell
        run: python -m pip install --upgrade pip pyinstaller

      - name: TeknikServisPro.exe oluştur
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name TeknikServisPro `
            --icon assets\TeknikServisPro.ico `
            server.py
          if (!(Test-Path "dist\TeknikServisPro.exe")) { throw "TeknikServisPro.exe oluşturulamadı." }

      - name: Dağıtım dosyalarını hazırla
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist\assets | Out-Null
          Copy-Item index.html -Destination dist\index.html -Force
          Copy-Item db.json -Destination dist\db.json -Force
          Copy-Item assets\TeknikServisPro.ico -Destination dist\assets\TeknikServisPro.ico -Force

      - name: Inno Setup kur
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Windows kurulum EXE oluştur
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\TeknikServisPro.iss"
          if (!(Test-Path "release\TeknikServisPro_v2_3_0_Setup.exe")) { throw "Kurulum EXE dosyası oluşturulamadı." }

      - name: Kurulum dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TeknikServisPro-v2.3.0-Python-Windows-Setup
          path: release/TeknikServisPro_v2_3_0_Setup.exe
          if-no-files-found: error
          retention-days: 30
