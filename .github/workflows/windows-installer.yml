name: Teknik Servis Pro - Windows Kurulum

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "server.py"
      - "desktop_launcher.py"
      - "db.json"
      - "TeknikServisPro.spec"
      - "assets/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derleme aracını kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1

      - name: Python kaynak kontrolü
        shell: pwsh
        run: |
          python -m py_compile server.py
          python -m py_compile desktop_launcher.py

      - name: Windows uygulamasını oluştur
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean TeknikServisPro.spec
          if (!(Test-Path "dist\TeknikServisPro\TeknikServisPro.exe")) {
            throw "TeknikServisPro.exe oluşturulamadı."
          }

      - name: Uygulamayı çalıştır ve health test et
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$pwd\dist\TeknikServisPro\TeknikServisPro.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8972/api/health" -TimeoutSec 2
                if ($response.ok -eq $true -and $response.version -eq "2.3.4") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "Teknik Servis Pro health testi başarısız."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Inno Setup ile kurulum EXE'si oluştur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\TeknikServisPro.iss"
          if (!(Test-Path "release\TeknikServisPro_v2_3_4_Setup.exe")) {
            throw "Kurulum EXE dosyası oluşturulamadı."
          }

      - name: SHA-256 oluştur
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release\TeknikServisPro_v2_3_4_Setup.exe" -Algorithm SHA256).Hash
          "TeknikServisPro_v2_3_4_Setup.exe  SHA256: $hash" | Out-File "release\SHA256.txt" -Encoding utf8

      - name: Kurulum dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: TeknikServisPro-v2.3.4-Windows-Setup
          path: |
            release/TeknikServisPro_v2_3_4_Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
